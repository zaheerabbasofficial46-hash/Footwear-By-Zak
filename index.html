<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOOTWEAR BY ZAK | Premium Leather Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        serif: ['"Playfair Display"', 'serif'] 
                    },
                    colors: { 
                        brand: { 
                            black: '#050505',
                            dark: '#111111', 
                            card: '#1a1a1a', 
                            copper: '#B87333', 
                            gold: '#D4AF37', 
                            light: '#F8F5F0', 
                            gray: '#888888',
                            border: '#333333' 
                        } 
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #F8F5F0; 
            -webkit-font-smoothing: antialiased; 
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #B87333; }

        .text-gradient { 
            background-clip: text; 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-image: linear-gradient(135deg, #D4AF37, #B87333); 
        }
        
        .btn-gold { 
            background: linear-gradient(135deg, #D4AF37, #B87333); 
            color: #050505; 
            transition: all 0.3s ease; 
        }
        .btn-gold:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4); 
        }
        
        .glass-header { 
            background: rgba(5, 5, 5, 0.8); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #D4AF37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <header class="glass-header fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20 md:h-24">
                <!-- Logo -->
                <div class="flex items-center gap-4 select-none">
                    <div class="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-brand-gold to-brand-copper flex items-center justify-center text-brand-black text-2xl font-serif font-bold shadow-lg">Z</div>
                    <div class="flex flex-col justify-center">
                        <span class="text-brand-light text-lg md:text-xl font-serif font-bold uppercase tracking-[0.2em] leading-none">Footwear By</span>
                        <span class="text-brand-copper text-sm md:text-md font-serif font-bold uppercase tracking-[0.3em] leading-tight mt-1">Zak</span>
                    </div>
                </div>
                
                <!-- Cart Button -->
                <button onclick="app.toggleCart()" class="w-12 h-12 rounded-full border border-brand-border flex items-center justify-center text-brand-light hover:text-brand-gold hover:border-brand-gold transition-all relative group bg-brand-dark">
                    <i class="fa-solid fa-shopping-bag"></i>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-brand-gold text-brand-black text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full opacity-0 transition-opacity">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow pt-24">
        <section class="relative min-h-[70vh] flex items-center justify-center overflow-hidden px-4 py-20">
            <div class="absolute inset-0 z-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-brand-copper via-brand-black to-brand-black"></div>
            
            <div class="relative z-10 max-w-4xl mx-auto text-center animate-fade-up">
                <p class="text-brand-copper text-xs md:text-sm font-bold uppercase tracking-[0.3em] mb-6">Handcrafted in Pakistan</p>
                <h1 class="text-5xl md:text-7xl lg:text-8xl font-serif font-bold text-brand-light leading-tight mb-8">
                    The Pinnacle of <br><span class="text-gradient font-italic">Leather Artistry.</span>
                </h1>
                <p class="text-brand-gray text-md md:text-xl max-w-2xl mx-auto font-light leading-relaxed mb-10">
                    Masterfully crafted footwear designed for the modern gentleman. Experience unmatched luxury delivered to your doorstep.
                </p>
                <a href="#collection" class="inline-flex items-center justify-center btn-gold px-8 py-4 text-xs font-bold uppercase tracking-[0.2em] shadow-2xl">
                    Explore Collection <i class="fa-solid fa-chevron-right ml-3 text-[10px]"></i>
                </a>
            </div>
        </section>

        <section id="collection" class="py-24 bg-brand-dark border-t border-brand-border">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col items-center mb-16">
                    <h2 class="text-3xl md:text-4xl font-serif font-bold text-brand-light text-center">Curated Selection</h2>
                    <div class="w-12 h-[2px] bg-brand-copper mt-6"></div>
                </div>
                
                <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                    <!-- Loading Spinner -->
                    <div class="col-span-full flex justify-center py-20">
                        <div class="loader"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-brand-black/90 backdrop-blur-sm z-[100] hidden opacity-0 transition-opacity duration-300">
        <div class="absolute right-0 top-0 bottom-0 w-full md:w-[450px] bg-brand-dark border-l border-brand-border shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300" id="cartDrawer">
            
            <div class="p-6 border-b border-brand-border flex justify-between items-center bg-brand-black">
                <h3 class="text-xl font-serif font-bold text-brand-light">Your Cart</h3>
                <button onclick="app.toggleCart()" class="text-brand-gray hover:text-brand-light transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- Cart items go here -->
            </div>
            
            <div class="p-6 bg-brand-black border-t border-brand-border">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-brand-gray uppercase tracking-widest text-xs font-bold">Total</span>
                    <span id="cartTotal" class="text-brand-gold font-serif font-bold text-2xl">PKR 0</span>
                </div>
                
                <!-- WhatsApp Checkout Form -->
                <div class="space-y-4 mb-6">
                    <input type="text" id="customerName" placeholder="Full Name" class="w-full bg-brand-dark border border-brand-border p-3 text-sm text-brand-light outline-none focus:border-brand-copper rounded-none placeholder-brand-gray/50">
                    <input type="text" id="customerAddress" placeholder="Delivery Address" class="w-full bg-brand-dark border border-brand-border p-3 text-sm text-brand-light outline-none focus:border-brand-copper rounded-none placeholder-brand-gray/50">
                </div>
                
                <button onclick="app.checkoutViaWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#1DA851] text-white py-4 font-bold uppercase text-xs tracking-widest transition-colors flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. YOUR SETTINGS
        // ==========================================
        
        // Put your business WhatsApp number here:
        const whatsappNumber = "923001234567"; 

        // CRITICAL: Paste your Google Sheet TSV Publish link here:
        // (Make sure it ends in pub?output=tsv)
        const googleSheetUrl = ""; 

        // ==========================================

        const app = {
            products: [],
            cart: [],
            
            init() {
                this.loadProductsFromGoogle();
                this.updateCartBadge();
            },

            async loadProductsFromGoogle() {
                const grid = document.getElementById('productGrid');
                
                if (!googleSheetUrl) {
                    grid.innerHTML = `
                        <div class="col-span-full bg-brand-card border border-brand-border p-8 text-center">
                            <h3 class="text-brand-gold font-bold mb-2">STORE IS ALMOST READY!</h3>
                            <p class="text-brand-gray text-sm">Please follow the Guide to paste your Google Sheet link into the code.</p>
                        </div>`;
                    return;
                }

                try {
                    // Fetch the spreadsheet data
                    const response = await fetch(googleSheetUrl);
                    const data = await response.text();
                    
                    // Convert TSV (Tab Separated Values) to Javascript Array
                    const rows = data.split('\n');
                    const productsList = [];
                    
                    // Skip the first row (headers)
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i].split('\t'); // Split by Tab
                        
                        if (cols.length >= 5 && cols[1].trim() !== '') {
                            productsList.push({
                                id: cols[0].trim(),
                                name: cols[1].trim(),
                                price: parseInt(cols[2].replace(/[^0-9]/g, '')),
                                category: cols[3].trim(),
                                image: cols[4].trim()
                            });
                        }
                    }

                    this.products = productsList;
                    this.renderStorefront();

                } catch (error) {
                    console.error("Error loading Google Sheet:", error);
                    grid.innerHTML = `<div class="col-span-full py-20 text-center text-red-500 text-xs tracking-widest uppercase border border-brand-border bg-brand-card">Could not load products. Please check the Google Sheet link.</div>`;
                }
            },

            renderStorefront() {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';
                
                if (this.products.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-20 text-center text-brand-gray text-xs tracking-widest uppercase border border-brand-border bg-brand-card">No products currently available in the Google Sheet.</div>`;
                    return;
                }

                this.products.forEach(p => {
                    grid.innerHTML += `
                        <div class="bg-brand-card border border-brand-border group hover:border-brand-copper transition-colors duration-300 flex flex-col">
                            <div class="relative h-80 overflow-hidden bg-brand-dark">
                                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-90 group-hover:opacity-100" onerror="this.src='https://placehold.co/600x600/111/D4AF37?text=Shoe'">
                                <div class="absolute top-4 left-4 bg-brand-black/80 backdrop-blur text-brand-light text-[10px] font-bold uppercase tracking-widest px-3 py-1 border border-brand-border">${p.category}</div>
                            </div>
                            <div class="p-6 flex flex-col flex-1">
                                <h3 class="font-serif font-bold text-xl text-brand-light mb-2 group-hover:text-brand-copper transition-colors">${p.name}</h3>
                                <div class="text-brand-gold font-serif font-bold text-lg mb-6">PKR ${Number(p.price).toLocaleString()}</div>
                                <button onclick="app.addToCart('${p.id}')" class="mt-auto w-full bg-brand-dark border border-brand-border text-brand-light py-3 text-[10px] font-bold uppercase tracking-widest hover:bg-brand-light hover:text-brand-black transition-all">Add to Cart</button>
                            </div>
                        </div>
                    `;
                });
            },

            // CART LOGIC
            toggleCart() {
                const modal = document.getElementById('cartModal');
                const drawer = document.getElementById('cartDrawer');
                
                if (modal.classList.contains('hidden')) {
                    modal.classList.remove('hidden');
                    setTimeout(() => {
                        modal.classList.remove('opacity-0');
                        drawer.classList.remove('translate-x-full');
                    }, 10);
                    this.renderCart();
                } else {
                    modal.classList.add('opacity-0');
                    drawer.classList.add('translate-x-full');
                    setTimeout(() => {
                        modal.classList.add('hidden');
                    }, 300);
                }
            },

            addToCart(id) {
                const product = this.products.find(p => p.id === id);
                if (product) {
                    this.cart.push(product);
                    this.updateCartBadge();
                    
                    const btn = event.target;
                    const originalText = btn.innerText;
                    btn.innerText = "Added!";
                    btn.classList.add('bg-brand-copper', 'text-brand-black', 'border-brand-copper');
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.classList.remove('bg-brand-copper', 'text-brand-black', 'border-brand-copper');
                    }, 1500);
                }
            },

            removeFromCart(index) {
                this.cart.splice(index, 1);
                this.updateCartBadge();
                this.renderCart();
            },

            updateCartBadge() {
                const badge = document.getElementById('cartBadge');
                badge.innerText = this.cart.length;
                if (this.cart.length > 0) {
                    badge.classList.remove('opacity-0');
                } else {
                    badge.classList.add('opacity-0');
                }
            },

            renderCart() {
                const container = document.getElementById('cartItems');
                const totalEl = document.getElementById('cartTotal');
                container.innerHTML = '';
                
                if (this.cart.length === 0) {
                    container.innerHTML = `<div class="text-center text-brand-gray text-xs tracking-widest uppercase mt-10">Your cart is empty</div>`;
                    totalEl.innerText = "PKR 0";
                    return;
                }

                let total = 0;
                this.cart.forEach((item, index) => {
                    total += Number(item.price);
                    container.innerHTML += `
                        <div class="flex gap-4 items-center bg-brand-black p-3 border border-brand-border">
                            <img src="${item.image}" class="w-16 h-16 object-cover border border-brand-border">
                            <div class="flex-1">
                                <h4 class="text-sm font-bold text-brand-light">${item.name}</h4>
                                <div class="text-brand-gold text-xs font-serif mt-1">PKR ${Number(item.price).toLocaleString()}</div>
                            </div>
                            <button onclick="app.removeFromCart(${index})" class="text-brand-gray hover:text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
                
                totalEl.innerText = `PKR ${total.toLocaleString()}`;
            },

            checkoutViaWhatsApp() {
                if (this.cart.length === 0) {
                    alert("Your cart is empty.");
                    return;
                }

                const name = document.getElementById('customerName').value.trim();
                const address = document.getElementById('customerAddress').value.trim();

                if (!name || !address) {
                    alert("Please enter your name and delivery address.");
                    return;
                }

                let orderDetails = `*NEW ORDER - FOOTWEAR BY ZAK*%0A%0A`;
                orderDetails += `*Customer:* ${name}%0A`;
                orderDetails += `*Address:* ${address}%0A%0A`;
                orderDetails += `*Items:*%0A`;
                
                let total = 0;
                this.cart.forEach((item, i) => {
                    orderDetails += `${i+1}. ${item.name} - PKR ${Number(item.price).toLocaleString()}%0A`;
                    total += Number(item.price);
                });
                
                orderDetails += `%0A*TOTAL AMOUNT:* PKR ${total.toLocaleString()}`;

                const waUrl = `https://wa.me/${whatsappNumber}?text=${orderDetails}`;
                window.open(waUrl, '_blank');
                
                this.cart = [];
                this.updateCartBadge();
                this.toggleCart();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
